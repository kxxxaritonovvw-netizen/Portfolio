<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Портфолио</title>
    <link rel="stylesheet" href="badge.css" />
    <style>
      :root { color-scheme: dark; background: #090a0d; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; overflow: hidden; }
    </style>
  </head>
  <body>
    <section class="intro-screen" aria-label="О дизайнере" hidden>
      <p class="intro" lang="en" aria-label="Hi there! I’m product designer with 7 yoe. Worked on products in the fields of: igaming, fintech + web3, edtech">
        <span class="intro-size" aria-hidden="true">Hi there! I’m product designer with 7 yoe. Worked on products in the fields of: igaming, fintech + web3, edtech</span>
        <span class="intro-typed" aria-hidden="true"></span>
      </p>
    </section>
    <main class="badge-scene" aria-label="Портфолио дизайнера">
      <button class="badge-handle" type="button" aria-pressed="false" aria-label="Перевернуть бейдж. Тяните для движения, используйте стрелки клавиатуры для раскачивания." title="Клик — перевернуть · Потяни — покачать"></button>
    </main>
    <p class="scroll-hint">Листай ниже.<br>Знакомься ближе.<br>И кайфуй.</p>
    <div class="contact-dock" inert>
      <button class="say-hi" type="button" aria-expanded="false" aria-controls="contact-options">Say hi</button>
      <div class="contact-options" id="contact-options" role="group" aria-label="Связаться" inert>
        <button class="contact-option" type="button" aria-label="Telegram" title="Telegram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.5 3.5-3.3 16c-.25 1.13-.9 1.4-1.82.87l-5-3.69-2.42 2.33c-.27.27-.5.5-1.02.5l.36-5.09 9.27-8.38c.4-.36-.09-.57-.62-.21L5.5 13.05.56 11.5c-1.07-.33-1.09-1.07.22-1.58L20.1 2.47c.9-.33 1.69.21 1.4 1.03Z"/></svg>
        </button>
        <button class="contact-option" type="button" aria-label="LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.3 7.5a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2ZM3.5 9h3.6v12H3.5V9Zm5.9 0h3.45v1.64h.05C13.38 9.72 14.56 8.75 16.32 8.75c3.67 0 4.35 2.42 4.35 5.56V21h-3.6v-5.93c0-1.42-.03-3.24-1.97-3.24-1.98 0-2.28 1.55-2.28 3.14V21H9.4V9Z"/></svg>
        </button>
        <button class="contact-option" type="button" aria-label="Почта" title="Почта">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="mail-icon"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
        </button>
      </div>
    </div>
    <script src="intro.js" defer></script>
    <script type="module" src="badge.js"></script>
  </body>
</html>
